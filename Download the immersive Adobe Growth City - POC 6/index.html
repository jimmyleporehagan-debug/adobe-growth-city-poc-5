<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adobe Growth City</title><style>
:root{--navy:#06284f;--navy2:#123b64;--steel:#66829b;--steel2:#a9bcc9;--cyan:#00d9ee;--green:#42be70;--red:#e43b2e;--cream:#edf2f4;--ink:#11263b;--amber:#e5a436}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Verdana,Arial,sans-serif;background:#153b56;color:#fff}.city-bg{position:fixed;inset:49px 0 23px;background:url('assets/city.png') center/cover no-repeat;z-index:-3}.topbar{height:49px;position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:7px;padding:4px 7px;background:linear-gradient(#869db0,#506a82);border-bottom:3px ridge #d4dfe6}.brand{height:38px;display:flex;align-items:center;gap:8px;background:var(--navy);border:3px ridge #b3c5d0;padding:2px 12px 2px 5px;font-weight:900;font-size:19px;white-space:nowrap}.brand img{width:37px;height:31px;object-fit:contain}.topbtn{height:36px;border:3px outset #d9e3e8;background:linear-gradient(#f4f6f7,#aebdc6);font-weight:900;color:#12263a;padding:0 10px;cursor:pointer}.topbtn:disabled{display:none}.city-title{flex:1;background:#e8edef;color:#13273c;border:3px inset #99abb6;padding:6px 10px;text-align:center;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-chip{height:38px;display:flex;align-items:center;gap:6px;background:var(--navy);border:3px ridge #b6c6d0;padding:2px 8px;cursor:pointer}.profile-chip img{width:29px;height:29px;object-fit:cover}.profile-chip small{display:block;color:#cadde8;font-size:9px}.bottomline{position:fixed;bottom:0;left:0;right:0;height:23px;background:var(--navy);border-top:2px ridge #adc1ce;z-index:80;padding:3px 11px;font-size:11px;font-style:italic}.page{min-height:calc(100vh - 72px);padding:22px 18px 50px}.layout{max-width:1260px;margin:auto;display:grid;grid-template-columns:235px minmax(0,1fr);gap:13px;align-items:start}.advisor-rail{position:sticky;top:64px;background:#dfe8ec;color:#11263b;border:5px outset #c7d4da;box-shadow:5px 5px #1a3447}.advisor-title{background:var(--navy);color:#fff;font-weight:900;padding:6px 8px}.advisor-rail img{width:100%;max-height:225px;object-fit:cover;object-position:center top;border-bottom:3px inset #8196a3}.advisor-copy{padding:10px;font-weight:700;line-height:1.35}.game-window{background:linear-gradient(135deg,#597794,#314e6c);border:6px ridge #aebfcb;box-shadow:9px 9px rgba(2,20,34,.6)}.window-title{background:linear-gradient(90deg,#073266,#041f43);border-bottom:4px ridge #91a8b7;padding:10px 15px;text-align:center;font-size:30px;font-weight:900;text-shadow:2px 2px #07182b}.window-content{padding:18px}.intro{text-align:center;font-size:18px;font-style:italic;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}.field{background:#dce5e9;color:var(--ink);border:4px inset #92a6b2;padding:10px}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field select,.field textarea{font:inherit;width:100%;padding:9px;background:#fff;color:#111;border:3px inset #99aab5}.pick{position:relative;background:linear-gradient(#d7e2e7,#93a7b5);color:#11273d;border:4px outset #cad7de;padding:10px;cursor:pointer}.pick:hover{filter:brightness(1.05)}.pick.on{border-color:#65e8f4;box-shadow:0 0 0 3px var(--cyan),inset 0 0 0 2px #fff;background:linear-gradient(#c8edf0,#76b6c3)}.pick.on:after{content:'✓';position:absolute;right:5px;top:4px;background:#0b7181;color:white;padding:2px 5px;font-weight:900}.pick h3{margin:0 0 5px}.portrait-card{padding:5px}.portrait-card img{width:100%;aspect-ratio:.72;object-fit:cover;object-position:center top;border:4px inset #8196a3;display:block}.role-band{background:var(--navy);color:white;text-align:center;padding:7px;font-weight:900}.picks4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.actions{display:flex;justify-content:space-between;margin-top:16px;gap:10px}.primary,.secondary{padding:10px 18px;font-weight:900;font-size:15px;cursor:pointer}.primary{color:white;background:linear-gradient(#00ccde,#087d90);border:4px outset #6ce3eb}.secondary{color:#11263b;background:linear-gradient(#f2f4f5,#aab9c3);border:4px outset #d7e1e6}.city-map{height:620px;position:relative;background:url('assets/city.png') center/cover;border:6px inset #a1b4bf;overflow:hidden}.problem-overlay{position:absolute;inset:55px 85px 60px;background:linear-gradient(135deg,rgba(75,101,128,.97),rgba(40,67,92,.98));border:6px ridge #b4c5d0;z-index:10;box-shadow:10px 10px rgba(5,20,34,.55);padding:17px}.problem-overlay h1{background:var(--navy);border:3px ridge #9db2c0;padding:8px;text-align:center;margin:0 0 10px;font-size:27px}.problem-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.problem-stat{background:#e8edf0;color:#14263a;border:4px outset #d0dbe1;padding:13px;text-align:center}.problem-stat strong{display:block;font-size:25px;color:#b52f24}.theory{background:#dbe5e9;color:#12263b;border:4px outset #cbd7dd;padding:10px;margin-top:8px}.building{position:absolute;width:155px;background:linear-gradient(#e4ecef,#93a9b7);color:#11273d;border:4px outset #cfdae0;padding:8px;font-weight:900;z-index:8;cursor:pointer;text-align:left}.building small{display:block;font-size:9px}.building.on{background:linear-gradient(#b8eff2,#68c6d0);box-shadow:0 0 0 3px #fff,0 0 0 7px var(--cyan)}.b1{left:6%;top:9%}.b2{left:39%;top:6%}.b3{right:6%;top:10%}.b4{left:8%;bottom:10%}.b5{left:40%;bottom:7%}.b6{right:7%;bottom:12%}.context-hub{position:absolute;left:43%;top:39%;z-index:7;background:#0b7890;border:5px outset #62dce7;padding:22px;text-align:center;font-weight:900}.route{position:absolute;height:7px;background:#77878e;opacity:.5;z-index:3;transform-origin:left center}.route.live{background:var(--cyan);opacity:1;box-shadow:0 0 10px var(--cyan)}.r1{left:17%;top:26%;width:35%;transform:rotate(26deg)}.r2{left:47%;top:20%;width:24%;transform:rotate(87deg)}.r3{left:52%;top:31%;width:35%;transform:rotate(-17deg)}.r4{left:20%;top:72%;width:35%;transform:rotate(-32deg)}.r5{left:50%;top:70%;width:23%;transform:rotate(-88deg)}.r6{left:52%;top:60%;width:36%;transform:rotate(21deg)}.drawer{position:absolute;right:10px;top:178px;width:225px;background:#edf2f4;color:#11263a;border:4px outset #d0dbe0;padding:8px;z-index:9}.explain{margin-top:11px;background:#edf3f5;color:#10273d;border-left:8px solid #0b849a;padding:12px;line-height:1.45}.findings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.finding{background:#ebf0f2;color:#11263c;border:4px outset #d1dce1;padding:9px}.finding.locked{opacity:.55;filter:grayscale(1)}.chart{height:65px;border:3px inset #9babb5;background:linear-gradient(150deg,transparent 45%,#da493c 46% 50%,transparent 51%),repeating-linear-gradient(90deg,#d5e0e4 0 1px,transparent 1px 18px)}.diagnosis{background:var(--navy);border:4px ridge #9eb4c2;padding:14px;margin-top:11px;font-size:17px}.play-art{height:85px;background:#e3eaed;color:#15364b;border:3px inset #8298a7;display:grid;place-items:center;font-weight:900;font-size:19px}.workflow{display:flex;gap:6px;align-items:center;overflow:auto;padding:10px 0}.node{min-width:120px;background:#e7edef;color:#10263b;border:4px outset #d0dbe1;padding:11px;text-align:center;font-weight:900}.node.done{background:#c9edd6}.node.pending{background:#eedbad}.artifact{background:#edf2f4;color:#11273c;border:4px inset #99acb7;padding:12px;min-height:270px}.bluepaper{background-color:#dfe9ed;background-image:linear-gradient(#bdcfd6 1px,transparent 1px),linear-gradient(90deg,#bdcfd6 1px,transparent 1px);background-size:20px 20px}.beforeafter{display:grid;grid-template-columns:1fr 35px 1fr;gap:7px;align-items:center}.mini{background:#fff;border:3px outset #c8d4da;padding:10px;min-height:175px}.why{margin-top:10px;background:#edf3f5;color:#10263b;border-left:9px solid #0b8298;padding:12px;line-height:1.45}.blueprint-sheet{background:#07305a;background-image:linear-gradient(rgba(78,150,197,.38) 1px,transparent 1px),linear-gradient(90deg,rgba(78,150,197,.38) 1px,transparent 1px);background-size:20px 20px;border:7px double #bdd4e0;padding:20px;box-shadow:8px 8px #18394c;position:relative}.blueprint-sheet:before{content:'NORTHSTAR RECOVERY PLAN';display:block;font-size:26px;font-weight:900;border-bottom:3px solid #9ed5f1;padding-bottom:8px;margin-bottom:14px}.blueprint-sheet:after{content:'DRAFT • SYNTHETIC SCENARIO';position:absolute;right:18px;top:20px;font-size:10px}.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.plan{background:rgba(235,245,249,.95);color:#123047;border:4px outset #c6d7df;padding:12px;min-height:165px}.party-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.party-card{background:#a7bac5;border:4px outset #cbd7de;color:#10263b;padding:5px}.party-card img{width:100%;aspect-ratio:.7;object-fit:cover;object-position:top;border:3px inset #8297a4}.party-role{background:var(--navy);color:#fff;text-align:center;font-weight:900;padding:5px;font-size:11px}.party-card label{display:block;background:#edf1f3;border:2px inset #a7b5bd;padding:5px;text-align:center;font-size:10px}.player-card{display:grid;grid-template-columns:220px 1fr;gap:12px;background:#9fb4c0;color:#10263a;border:6px outset #d0dce2;padding:11px}.player-card>img{width:100%;border:4px inset #8296a3}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.stat{background:#e7ecef;border:3px inset #9fafb9;padding:7px}.outcome{background:#e8eef1;color:#10263a;border:5px outset #ced9df;padding:18px;text-align:center}.outcome h2{color:#07315a}.email-row,.calendar-grid{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.calendar-grid{grid-template-columns:repeat(3,1fr)}.backstage{background:#07315a;background-image:linear-gradient(rgba(74,143,188,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(74,143,188,.25) 1px,transparent 1px);background-size:20px 20px;min-height:calc(100vh - 72px);padding:18px}.back-profile{display:grid;grid-template-columns:110px 1fr 260px;gap:10px;background:linear-gradient(#496983,#2f4e68);border:5px ridge #9fb6c5;padding:10px;margin-bottom:10px}.back-profile img{width:100%;border:3px inset #8298a5}.back-main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}.back-panel{background:linear-gradient(#496983,#2e4c66);border:5px ridge #9db4c4;padding:9px}.back-head{background:var(--navy);border:3px ridge #9eb4c2;padding:7px;font-size:18px;font-weight:900}.script{width:100%;min-height:250px;padding:12px;font:14px/1.45 Tahoma,Verdana;background:#f2f4f5;color:#10263a;border:4px inset #9dadb7}.hgroup{background:#e5ebee;color:#102438;border:3px inset #9badb8;margin-top:7px}.hgroup h4{margin:0;padding:5px 7px;background:#b8c9d1}.hitem{display:flex;gap:7px;padding:5px;border-top:1px solid #a9b8bf}.box{width:18px;height:18px;border:2px inset #7b909c;background:#fff;text-align:center;color:#11713b;font-weight:900}.box.y{background:#cdf0d8}.reach-box{display:grid;grid-template-columns:1fr 1fr;gap:8px}.modal{display:none;position:fixed;inset:0;background:rgba(3,18,30,.68);z-index:100;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modal .game-window{width:min(850px,100%)}.hide{display:none!important}@media(max-width:900px){.topbar{height:auto;flex-wrap:wrap}.city-title{order:6;flex-basis:100%}.layout{grid-template-columns:1fr}.advisor-rail{position:relative;top:auto;display:grid;grid-template-columns:110px 1fr}.advisor-rail img{height:130px}.grid .c3,.grid .c4,.grid .c6,.grid .c8{grid-column:span 12}.picks4,.findings,.plan-grid,.party-grid,.back-profile,.back-main{grid-template-columns:1fr}.city-map{height:760px}.problem-overlay{inset:35px 18px}.player-card{grid-template-columns:1fr}.party-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="city-bg"></div><header class="topbar"><div class="brand"><img src="assets/adobe-mark.png" alt="Adobe">ADOBE GROWTH CITY</div><button class="topbtn" id="back">◀</button><button class="topbtn" id="forward">▶</button><div class="city-title" id="cityTitle">New city • Retail / ecommerce</div><button class="topbtn" id="save">SAVE</button><div class="profile-chip" id="profileChip"><img id="profileImg" src="assets/data-analyst.png"><div><b id="profileName">Data Analyst</b><small id="saveText">Player Profile</small></div></div><button class="topbtn" id="backstageBtn">BACKSTAGE VIEW</button></header><main id="app" class="page"></main><main id="backstage" class="hide"></main><footer class="bottomline">Concept prototype • Synthetic data • No live systems connected • No messages or meetings sent</footer><div class="modal" id="profileModal"><div class="game-window"><div class="window-title">PLAYER PROFILE <button class="topbtn" style="float:right" id="closeProfile">X</button></div><div class="window-content" id="profileBody"></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s);const roles={analyst:{name:'Data Analyst',img:'assets/data-analyst.png',desc:'Find the signal in conflicting performance data.'},commerce:{name:'Ecommerce Lead',img:'assets/ecommerce-lead.png',desc:'Own storefront performance, journey friction and orders.'},marketing:{name:'Marketing Generalist',img:'assets/marketing-generalist.png',desc:'Connect campaigns, content, audiences and reporting.'},leader:{name:'Business Leader',img:'assets/business-leader.png',desc:'Focus on business outcomes, investment and readiness.'}};const systems={brand:'Brand Visibility',web:'Web behavior',commerce:'Commerce outcomes',profiles:'Customer profiles',content:'Content system',integration:'Integration requirements'};const party=[['Journey Owner','journey-owner'],['Data Steward','data-steward'],['Budget Sponsor','budget-sponsor'],['Store Operator','store-operator'],['Systems Connector','systems-connector'],['Brand Guardian','brand-guardian'],['Content Builder','content-builder'],['Campaign Owner','campaign-owner'],['Sales Partner','sales-partner'],['Privacy Reviewer','privacy-reviewer']];
const plays={discovery:{name:'Repair AI discovery + content',artifact:'AI discovery repair brief',why:'Coworker uses Brand Visibility evidence to identify high-intent prompts and topics where the brand is absent, then coordinates a draft content response using approved product facts and governed content workflows. Clearer, structured answers may improve eligibility for AI discovery and help qualified shoppers reach relevant owned pages. This does not guarantee citation or ranking; visibility, qualified visits and downstream orders must be measured over time.'},journey:{name:'Design a recovery journey',artifact:'Before / after journey draft',why:'Coworker analyzes arrival intent and journey fallout, resolves an eligible recovery audience, drafts a revised journey graph and identifies content, rules and approvals. Matching a specific shopper question to a relevant experience may remove unnecessary steps and preserve qualified visitors. Actual benefit requires an approved controlled test.'},audience:{name:'Build a recovery audience',artifact:'Audience rules + eligibility preview',why:'Coworker translates the business problem into available attributes, checks existing audiences, resolves duplicates, estimates reach and applies consent and recent-purchase exclusions. The value comes from creating an eligible group that can receive a different treatment and whose outcome can be measured.'},test:{name:'Run a controlled test',artifact:'Controlled experiment plan',why:'Coworker drafts the hypothesis, audience allocation, variant needs, primary metric and guardrails, checks conflicts and presents the setup for approval. This path assumes the recommendation may be wrong. It creates a safe way to learn before scaling.'}};
const D={view:'character',history:['character'],future:[],company:'Northstar Outfitters',industry:'Retail / ecommerce',role:'analyst',priority:'Evidence',challenge:'Fewer shoppers find us',objective:'Recover traffic',systems:[],play:null,approved:false,savedPlay:false,party:[],readiness:'Building the case',downloaded:false,invited:false,expert:false,timeline:false,compared:false,nextMove:null,outcome:null};let S=Object.assign({},D,JSON.parse(localStorage.getItem('agcImmersive')||'{}'));const pages=['character','world','problem','connect','investigate','plays','run','blueprint','profile','next','complete'];
function role(){return roles[S.role]||roles.analyst}function persist(){localStorage.setItem('agcImmersive',JSON.stringify(S));$('#saveText').textContent='Saved locally'}function go(v,record=true){if(!pages.includes(v))v='character';if(record&&v!==S.view){S.history.push(v);S.future=[]}S.view=v;location.hash=v;persist();render()}function back(){if(S.history.length>1){let old=S.history.pop();S.future.unshift(old);S.view=S.history[S.history.length-1];location.hash=S.view;persist();render()}}function forward(){if(S.future.length){let v=S.future.shift();S.history.push(v);S.view=v;location.hash=v;persist();render()}}
function advisor(text){return `<aside class="advisor-rail"><div class="advisor-title">CX COWORKER • ADVISOR</div><img src="assets/advisor.png" alt="CX Coworker advisor"><div class="advisor-copy">${text}</div></aside>`}function windowBox(title,body){return `<div class="game-window"><div class="window-title">${title}</div><div class="window-content">${body}</div></div>`}function layout(title,body,advice){return `<section class="layout">${advisor(advice)}${windowBox(title,body)}</section>`}function pick(cls,key,val,current,body){return `<div class="pick ${cls} ${val===current?'on':''}" data-key="${key}" data-value="${val}">${body}</div>`}function controls(label,next){return `<div class="actions"><button class="secondary" data-back>◀ BACK</button><button class="primary" data-go="${next}">${label} ▶</button></div>`}
function render(){const r=role();$('#profileImg').src=r.img;$('#profileName').textContent=r.name;$('#cityTitle').textContent=`${S.company} • ${S.industry}`;$('#back').disabled=S.view==='character'||S.history.length<=1;$('#forward').disabled=!S.future.length;$('#app').innerHTML=view();$('#app').classList.remove('hide');$('#backstage').classList.add('hide');$('#backstageBtn').textContent='BACKSTAGE VIEW';wire()}
function view(){switch(S.view){case'character':return layout('BUILD YOUR CHARACTER',`<p class="intro">Choose the viewpoint you bring into Growth City. This portrait stays with you through the entire experience.</p><div class="grid">${Object.entries(roles).map(([k,r])=>pick('c3 portrait-card','role',k,S.role,`<img src="${r.img}" alt="${r.name}"><div class="role-band">${r.name.toUpperCase()}</div><p>${r.desc}</p>`)).join('')}</div><h2>What matters most?</h2><div class="picks4">${['Speed','Evidence','Growth','Control'].map(x=>pick('','priority',x,S.priority,x)).join('')}</div><div class="actions"><span></span><button class="primary" data-go="world">BUILD MY WORLD ▶</button></div>`,`Choose a role based on how you approach the problem. The role changes the explanation and recap, not your assumed authority to buy.`);
case'world':return layout('BUILD YOUR WORLD',`<p class="intro">Your business. Your city. A new way to grow.</p><div class="grid"><div class="field c6"><label>Company name</label><input id="company" value="${S.company}"></div><div class="field c6"><label>Industry</label><select><option>Retail / ecommerce</option><option disabled>Services — coming later</option><option disabled>Software — coming later</option></select></div></div><h2>What needs fixing?</h2><div class="grid">${['Fewer shoppers find us','Visitors leave without buying','Campaigns miss their targets'].map(x=>pick('c4','challenge',x,S.challenge,`<h3>${x}</h3><p>${x==='Fewer shoppers find us'?'Traffic is down. Find out why.':x==='Visitors leave without buying'?'Shoppers arrive but do not order.':'Teams see activity without consistent outcomes.'}</p>`)).join('')}</div><h2>What's your objective?</h2><div class="picks4">${['Recover traffic','Increase orders','Explain what changed','Build a leadership case'].map(x=>pick('','objective',x,S.objective,x)).join('')}</div>${controls('ENTER GROWTH CITY','problem')}`,`Start with your business. We will investigate together using a fictional dataset tailored to this scenario.`);
case'problem':return `<section class="layout">${advisor('The city has a problem. The teams disagree on the cause. Review the signals, then connect the systems that can explain what happened.')}<div class="city-map"><div class="problem-overlay"><h1>YOUR CITY HAS A PROBLEM</h1><p class="intro">${S.company} is losing qualified traffic and orders. Every team has a different theory.</p><div class="problem-stats"><div class="problem-stat">QUALIFIED TRAFFIC<strong>▼ 24%</strong></div><div class="problem-stat">ORDERS<strong>▼ 19%</strong></div><div class="problem-stat">CONVERSION<strong>UNCONFIRMED</strong></div></div><div class="theory"><b>Campaign:</b> Creative fatigue?</div><div class="theory"><b>Commerce:</b> Checkout friction?</div><div class="theory"><b>Content:</b> Discovery gaps?</div>${controls('CONNECT THE CITY','connect')}</div></div></section>`;
case'connect':{const labels=S.systems.map(k=>systems[k]);return `<section class="layout">${advisor('Select the systems I can reason across. Every connection opens a new route and reveals a new type of evidence. Connect at least three.')}<div><div class="city-map"><button class="building b1 ${S.systems.includes('brand')?'on':''}" data-system="brand">BRAND VISIBILITY<small>AI prompts + competitors</small></button><button class="building b2 ${S.systems.includes('web')?'on':''}" data-system="web">WEB BEHAVIOR<small>Arrival + journey</small></button><button class="building b3 ${S.systems.includes('commerce')?'on':''}" data-system="commerce">COMMERCE<small>Carts + orders</small></button><button class="building b4 ${S.systems.includes('profiles')?'on':''}" data-system="profiles">CUSTOMER PROFILES<small>Eligibility + value</small></button><button class="building b5 ${S.systems.includes('content')?'on':''}" data-system="content">CONTENT SYSTEM<small>Pages + product facts</small></button><button class="building b6 ${S.systems.includes('integration')?'on':''}" data-system="integration">INTEGRATION HUB<small>Access + requirements</small></button><div class="context-hub">COWORKER<br>CONTEXT HUB</div>${[1,2,3,4,5,6].map((n,i)=>`<i class="route r${n} ${S.systems.includes(['brand','web','commerce','profiles','content','integration'][i])?'live':''}"></i>`).join('')}<div class="drawer"><b>EVIDENCE UNLOCKED</b>${labels.length?`<ul>${labels.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>No connections yet.</p>'}<small>Read-only synthetic simulation</small></div></div><div class="explain"><b>What changed:</b> ${labels.length?`Coworker can now reason across ${labels.join(', ')}. The working diagnosis and feasible interventions will change as context grows.`:'Connect a building to light its route and unlock evidence.'}</div>${controls('INVESTIGATE','investigate')}</div></section>`}
case'investigate':{const ready=S.systems.length>=3;return layout('COWORKER INVESTIGATES',`<div class="findings">${[['brand','AI Visibility','Priority shopping prompts show weaker presence.'],['web','Qualified visits','AI-referred visits fell faster than total traffic.'],['commerce','Orders','Order loss tracks fewer qualified arrivals.'],['content','Product answers','Important shopping questions remain unanswered.']].map(x=>`<div class="finding ${S.systems.includes(x[0])?'':'locked'}"><h3>${x[1]}</h3><div class="chart"></div><p>${S.systems.includes(x[0])?x[2]:'Not connected.'}</p></div>`).join('')}</div><div class="diagnosis"><b>WORKING DIAGNOSIS</b><br>${ready?'Northstar has a qualified-discovery problem that is becoming an order problem. Relevance friction may compound the loss after arrival.':'Connect at least three evidence sources first.'}</div><div class="actions"><button class="secondary" data-go="connect">RETURN TO CITY</button>${ready?'<button class="primary" data-go="plays">CHOOSE A PLAY ▶</button>':''}</div>`,ready?'The connected evidence challenges the original theories. The problem begins before checkout, then compounds across the journey.':'I need more connected evidence before recommending a play.')}
case'plays':return layout('CHOOSE YOUR PLAY',`<div class="grid">${Object.entries(plays).map(([k,p])=>pick('c6','play',k,S.play,`<div class="play-art">${p.artifact.toUpperCase()}</div><h3>${p.name}</h3><p>${p.why.slice(0,150)}…</p>`)).join('')}</div><div class="actions"><button class="secondary" data-back>◀ BACK</button><button class="primary" ${S.play?'data-go="run"':'disabled'}>LET COWORKER BUILD IT ▶</button></div>`,`Choose a play. Each path creates a different artifact, visibly changes the city, and explains the causal logic before any approval.`);
case'run':{const p=plays[S.play]||plays.discovery;const art=S.play==='discovery'?`<div class="beforeafter"><div class="mini"><b>MISSING ANSWERS</b><p>Material?</p><p>Fit?</p><p>Care?</p><p>Availability?</p></div><b>→</b><div class="mini"><b>DRAFT REPAIR</b><p>✓ Add approved facts</p><p>✓ Structure topics</p><p>✓ Draft content brief</p></div></div>`:S.play==='journey'?`<div class="beforeafter"><div class="mini"><b>BEFORE</b><p>AI shopper → generic homepage → search → category → product</p></div><b>→</b><div class="mini"><b>DRAFT</b><p>AI question → relevant guide → eligible audience → products → follow-up</p></div></div>`:S.play==='audience'?`<div class="beforeafter"><div class="mini"><b>CRITERIA</b><p>Returning visitor</p><p>Outdoor intent</p><p>Consent eligible</p></div><b>→</b><div class="mini"><b>DRAFT AUDIENCE</b><p>Include recent intent</p><p>Exclude purchasers</p><p>Validate duplicates</p></div></div>`:`<div class="beforeafter"><div class="mini"><b>CONTROL A</b><p>Current experience</p><p>50% allocation</p></div><b>VS</b><div class="mini"><b>VARIANT B</b><p>Draft change</p><p>50% allocation</p><p>Guardrails visible</p></div></div>`;return layout(p.name.toUpperCase(),`<div class="workflow"><div class="node done">Read evidence</div>→<div class="node done">Resolve context</div>→<div class="node done">Draft</div>→<div class="node done">Validate</div>→<div class="node pending">Approval</div></div><div class="grid"><div class="artifact bluepaper c8"><h2>${p.artifact}</h2>${art}</div><div class="artifact c4"><h2>VISIBLE EFFECT</h2><p>The city map changes to show the activated districts, changed routes, and new work orders created by this play.</p><button class="primary" id="approve">${S.approved?'SIMULATION APPROVED ✓':'APPROVE SIMULATION'}</button></div></div><div class="why"><b>WHY THIS COULD DRIVE VALUE</b><p>${p.why}</p><small>Illustrative logic, not a forecast or guaranteed result.</small></div><div class="actions"><button class="secondary" data-go="plays">EXPLORE ANOTHER PLAY</button><button class="primary" data-go="blueprint">BUILD BLUEPRINT ▶</button></div>`,`I am creating a transparent draft. I stop at approval, show what changes, and preserve the connected systems' permissions and governance.`)}
case'blueprint':{const p=plays[S.play]||plays.discovery;return layout('RECOVERY BLUEPRINT',`<div class="blueprint-sheet"><div class="plan-grid"><div class="plan"><h3>NOW</h3><p>Confirm the diagnosis across connected evidence.</p><p><b>Artifact:</b> ${p.artifact}</p></div><div class="plan"><h3>NEXT 30 DAYS</h3><p>Review with the Journey Owner and Data Steward. Validate access, consent and feasibility.</p></div><div class="plan"><h3>NEXT 60–90 DAYS</h3><p>Run a bounded test, measure customer and commercial outcomes, and decide whether to scale.</p></div></div></div><h2>Save this workflow as a reusable playbook?</h2><div class="picks4">${pick('','savedPlay','true',String(S.savedPlay),'YES — SAVE THIS PLAY')}${pick('','savedPlay','false',String(S.savedPlay),'NO — KEEP PLAN ONLY')}</div><h2>Build your party</h2><div class="party-grid">${party.map(([name,file])=>`<div class="party-card"><img src="assets/${file}.png" alt="${name}"><div class="party-role">${name.toUpperCase()}</div><label><input type="checkbox" data-party="${name}" ${S.party.includes(name)?'checked':''}> I know this person</label></div>`).join('')}</div><button class="secondary" id="download">DOWNLOAD BLUEPRINT</button>${controls('VIEW PLAYER PROFILE','profile')}`,`This is a standalone leadership document, separate from gameplay. Build a party by checking each role directly on the character card.`)}
case'profile':{const r=role();return layout('PLAYER PROFILE',`<div class="player-card"><img src="${r.img}" alt="${r.name}"><div><h2>${S.company}</h2><h3>${r.name} • ${S.priority}</h3><div class="stats"><div class="stat"><b>MISSION</b><br>${S.objective}</div><div class="stat"><b>CHALLENGE</b><br>${S.challenge}</div><div class="stat"><b>CONNECTED</b><br>${S.systems.map(x=>systems[x]).join(', ')}</div><div class="stat"><b>PLAY</b><br>${S.play?plays[S.play].name:'None'}</div><div class="stat"><b>PLAYBOOK</b><br>${S.savedPlay?'Saved':'Not saved'}</div><div class="stat"><b>PARTY</b><br>${S.party.join(', ')||'None selected'}</div></div><h3>Where are you now?</h3><div class="picks4">${['Still exploring','Building the case','Ready to test','Need help making this real'].map(x=>pick('','readiness',x,S.readiness,x)).join('')}</div></div></div>${controls('CHOOSE NEXT MOVE','next')}`,`This profile is your save-game recap. Your selected portrait and every major decision carry into Backstage View.`)}
case'next':return layout('CHOOSE YOUR NEXT MOVE',`<div class="grid">${[['keep','Keep my blueprint','Finish with a thank-you page.'],['restart','Explore another scenario','Start over with a new city.'],['invite','Bring a colleague','Enter an email to share the simulation.'],['adobe','Ask Adobe to review my plan','Choose a simulated meeting time.']].map(x=>`<div class="pick c3" data-move="${x[0]}"><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div>`,`The plan is yours. Choose the next action. No email or meeting is actually sent by this prototype.`);
case'complete':return layout('NEXT MOVE',completion(),`This is the final state for the option you chose. You can play again or return to your Player Profile.`);default:return''}}
function completion(){if(S.nextMove==='keep')return `<div class="outcome"><h2>THANK YOU FOR PLAYING</h2><p>Your Recovery Blueprint is ready. No contact was requested.</p><button class="primary" data-go="character">PLAY AGAIN</button></div>`;if(S.nextMove==='restart')return `<div class="outcome"><h2>START A NEW CITY</h2><p>Your current game can be cleared and restarted with a new profile and scenario.</p><button class="primary" id="resetGame">RESET AND START OVER</button></div>`;if(S.nextMove==='invite')return `<div class="outcome"><h2>BRING A COLLEAGUE</h2><p>Enter an address to preview the invitation. This POC will not send it.</p><div class="email-row"><input id="colleagueEmail" placeholder="colleague@company.com"><button class="primary" id="previewInvite">PREVIEW EMAIL</button></div><div id="actionNote"></div></div>`;return `<div class="outcome"><h2>ASK ADOBE TO REVIEW YOUR PLAN</h2><p>Select a simulated 30-minute review. No calendar event will be created.</p><div class="calendar-grid"><button class="pick" data-slot="Tuesday 10:00 AM">Tuesday<br>10:00 AM</button><button class="pick" data-slot="Wednesday 2:00 PM">Wednesday<br>2:00 PM</button><button class="pick" data-slot="Thursday 11:30 AM">Thursday<br>11:30 AM</button></div><div id="actionNote"></div></div>`}
const high={Problem:['Selected a clear outcome','Investigated team disagreement','Changed hypothesis after evidence','Compared another brand'],Product:['Connected Brand Visibility','Used journey diagnosis','Built/refined audience','Previewed intervention','Configured test','Saved reusable playbook'],Organization:['Recognized Journey Owner','Recognized Data Steward','Recognized Budget Sponsor','Recognized Privacy Reviewer','Invited colleague'],Technical:['Explored integration requirements','Reviewed permissions/consent','Selected timeline'],Commercial:['Downloaded blueprint','Selected Building the case/Ready to test','Requested Adobe review']};function done(x){const m={'Selected a clear outcome':!!S.objective,'Investigated team disagreement':pages.indexOf(S.view)>=3,'Changed hypothesis after evidence':S.systems.length>=3,'Compared another brand':S.compared,'Connected Brand Visibility':S.systems.includes('brand'),'Used journey diagnosis':S.systems.includes('web')&&S.systems.includes('commerce'),'Built/refined audience':S.play==='audience'||S.play==='journey','Previewed intervention':S.approved,'Configured test':S.play==='test'&&S.approved,'Saved reusable playbook':S.savedPlay,'Recognized Journey Owner':S.party.includes('Journey Owner'),'Recognized Data Steward':S.party.includes('Data Steward'),'Recognized Budget Sponsor':S.party.includes('Budget Sponsor'),'Recognized Privacy Reviewer':S.party.includes('Privacy Reviewer'),'Invited colleague':S.invited,'Explored integration requirements':S.systems.includes('integration'),'Reviewed permissions/consent':S.approved,'Selected timeline':S.timeline,'Downloaded blueprint':S.downloaded,'Selected Building the case/Ready to test':['Building the case','Ready to test'].includes(S.readiness),'Requested Adobe review':S.expert};return!!m[x]}
function backstage(){const r=role();return `<div class="backstage"><div class="back-profile"><img src="${r.img}"><div><h2>${S.company} • ${r.name}</h2><p><b>Mission:</b> ${S.objective} &nbsp; <b>Challenge:</b> ${S.challenge}</p><p><b>Self-selected readiness:</b> ${S.readiness} &nbsp; <b>Priority:</b> ${S.priority}</p><p><b>Buying authority:</b> Unknown &nbsp; <b>Adobe footprint:</b> Unconfirmed</p></div><div><h3>RECOVERY PLAN</h3><p>${S.play?plays[S.play].name:'No play selected'}</p><button class="primary">OPEN BLUEPRINT</button></div></div><div class="back-main"><section class="back-panel"><div class="back-head">RECOMMENDED CONVERSATION</div><p><b>Continue the player's plan. Do not restart with a generic demo.</b></p><textarea class="script">Thanks for asking Adobe to review the plan you built in Growth City. You identified ${S.challenge.toLowerCase()} and explored ${S.play?plays[S.play].name.toLowerCase():'a recovery scenario'}. I’d like to use your Recovery Blueprint as our agenda rather than begin with a generic product demonstration.

First, I’d like to confirm what changed in your business and which outcome matters most. Then we can walk through the evidence you connected, the intervention you previewed, and the people you identified inside your organization. From there, we can validate where the real journey, customer, content and commerce data live; clarify permissions and governance; and outline a bounded proof that tests the recommendation before scaling.

The goal of the conversation is not to sell a broad transformation. It is to determine whether your recovery plan is feasible with your current stack, what Adobe capabilities would be relevant, and what evidence would justify a next step.</textarea><div class="reach-box"><div class="field"><b>Suggested subject</b><br>Review your ${S.company} Recovery Blueprint</div><div class="field"><b>Recommended channel</b><br>${S.expert?'Requested plan review':'Do not contact without permission'}</div></div><h3>Conversation agenda</h3><ol><li>Confirm the problem and success measure.</li><li>Review the player's draft artifact and causal logic.</li><li>Validate real data sources, stack and access.</li><li>Identify approval owners and missing collaborators.</li><li>Agree on a bounded test, timeline and evidence threshold.</li></ol><h3>Easy outreach</h3><div class="email-row"><input placeholder="Player email — not collected in POC"><button class="primary">DRAFT OUTREACH</button></div></section><aside class="back-panel"><div class="back-head">HIGH-VALUE ACTIONS</div>${Object.entries(high).map(([g,items])=>`<div class="hgroup"><h4>${g}</h4>${items.map(x=>`<div class="hitem"><span class="box ${done(x)?'y':''}">${done(x)?'✓':''}</span>${x}</div>`).join('')}</div>`).join('')}<p><small>Gameplay activity is not proof of purchase intent. Validate all hypotheses.</small></p></aside></div></div>`}
function wire(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-back]').forEach(x=>x.onclick=back);document.querySelectorAll('[data-key]').forEach(x=>x.onclick=()=>{let k=x.dataset.key,v=x.dataset.value;if(k==='savedPlay')v=v==='true';S[k]=v;persist();render()});const company=$('#company');if(company)company.onchange=()=>{S.company=company.value||'Northstar Outfitters';persist();render()};document.querySelectorAll('[data-system]').forEach(x=>x.onclick=()=>{let k=x.dataset.system;S.systems=S.systems.includes(k)?S.systems.filter(y=>y!==k):[...S.systems,k];persist();render()});document.querySelectorAll('[data-party]').forEach(x=>x.onchange=()=>{let k=x.dataset.party;S.party=x.checked?[...new Set([...S.party,k])]:S.party.filter(y=>y!==k);persist()});document.querySelectorAll('[data-move]').forEach(x=>x.onclick=()=>{S.nextMove=x.dataset.move;if(S.nextMove==='adobe')S.expert=true;if(S.nextMove==='invite')S.invited=true;persist();go('complete')});const approve=$('#approve');if(approve)approve.onclick=()=>{S.approved=true;persist();render()};const download=$('#download');if(download)download.onclick=downloadPlan;const reset=$('#resetGame');if(reset)reset.onclick=resetGame;const invite=$('#previewInvite');if(invite)invite.onclick=()=>{$('#actionNote').innerHTML='<p><b>Invitation preview created.</b> No email was sent.</p>'};document.querySelectorAll('[data-slot]').forEach(x=>x.onclick=()=>{S.timeline=true;persist();$('#actionNote').innerHTML=`<p><b>${x.dataset.slot} selected.</b> No calendar event was created.</p>`})}
function downloadPlan(){S.downloaded=true;persist();const p=plays[S.play]||plays.discovery;let text=`${S.company} RECOVERY BLUEPRINT\n\nPlayer: ${role().name}\nGoal: ${S.objective}\nPlay: ${p.name}\nConnected: ${S.systems.map(x=>systems[x]).join(', ')}\nParty: ${S.party.join(', ')}\n\nWhy: ${p.why}`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=S.company.replace(/\W+/g,'_')+'_Recovery_Blueprint.txt';a.click()}function resetGame(){localStorage.removeItem('agcImmersive');S=Object.assign({},D);location.hash='character';render()}
function showProfile(){const r=role();$('#profileBody').innerHTML=`<div class="player-card"><img src="${r.img}"><div><h2>${S.company}</h2><h3>${r.name} • ${S.priority}</h3><div class="stats"><div class="stat"><b>Mission</b><br>${S.objective}</div><div class="stat"><b>Connected</b><br>${S.systems.map(x=>systems[x]).join(', ')||'None yet'}</div><div class="stat"><b>Play</b><br>${S.play?plays[S.play].name:'Not selected'}</div><div class="stat"><b>Readiness</b><br>${S.readiness}</div></div></div></div>`;$('#profileModal').classList.add('show')}
$('#back').onclick=back;$('#forward').onclick=forward;$('#save').onclick=persist;$('#profileChip').onclick=showProfile;$('#closeProfile').onclick=()=>$('#profileModal').classList.remove('show');$('#backstageBtn').onclick=()=>{let open=$('#backstage').classList.contains('hide');if(open){$('#backstage').innerHTML=backstage();$('#backstage').classList.remove('hide');$('#app').classList.add('hide');$('#backstageBtn').textContent='PLAYER VIEW'}else render()};window.addEventListener('hashchange',()=>{let h=location.hash.slice(1);if(pages.includes(h)&&h!==S.view){S.view=h;render()}});if(pages.includes(location.hash.slice(1)))S.view=location.hash.slice(1);render();
</script></body></html>
